<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TikTok Feed - Royal Glam Boutique</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    body { background-color: #121212; color: #ffffff; font-family: 'ProximaNova', sans-serif; padding: 15px; }
    .tiktok-header { display: flex; align-items: center; gap: 15px; margin-bottom: 20px; padding-bottom: 15px; border-bottom: 1px solid #2f2f2f; }
    .tt-avatar { width: 75px; height: 75px; border-radius: 50%; object-fit: cover; }
    .tt-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .tt-card { position: relative; aspect-ratio: 9/16; background: #000; border-radius: 6px; overflow: hidden; }
    .tt-card img { width: 100%; height: 100%; object-fit: cover; opacity: 0.85; }
    .tt-card-info { position: absolute; bottom: 8px; left: 8px; font-size: 0.8rem; font-weight: bold; text-shadow: 0 1px 3px rgba(0,0,0,0.8); display: flex; align-items: center; gap: 4px; }
  </style>
</head>
<body>

  <!-- TikTok Header -->
  <div class="tiktok-header">
    <img src="https://images.unsplash.com/photo-1490481651871-ab68de25d43d?auto=format&fit=crop&w=300&q=80" class="tt-avatar" alt="TikTok Avatar">
    <div>
      <h5 class="fw-bold mb-1">@royalglamboutique</h5>
      <p class="small text-secondary mb-2">Royal Glam Official • 450.2K Likes</p>
      <a href="https://www.tiktok.com" target="_blank" class="btn btn-danger btn-sm px-4 fw-bold" style="background-color:#fe2c55; border:none;">Follow</a>
    </div>
  </div>

  <!-- Video Grid Preview -->
  <div class="tt-grid">
    <div class="tt-card">
      <img src="https://i.pinimg.com/1200x/68/a9/e0/68a9e089134881e2cc605e59233074dc.jpg" alt="TikTok 1">
      <div class="tt-card-info"><i class="bi bi-play-fill fs-6"></i> 84.5K</div>
    </div>
    <div class="tt-card">
      <img src="https://i.pinimg.com/1200x/4c/a6/87/4ca6871392ff1f4f9d4a039e93c7f38d.jpg" alt="TikTok 2">
      <div class="tt-card-info"><i class="bi bi-play-fill fs-6"></i> 120.1K</div>
    </div>
    <div class="tt-card">
      <img src="https://i.pinimg.com/1200x/7a/ae/73/7aae7315d6e577839c2ec3f88ec73b1f.jpg" alt="TikTok 3">
      <div class="tt-card-info"><i class="bi bi-play-fill fs-6"></i> 54.3K</div>
    </div>
  </div>

  <div class="text-center mt-4">
    <a href="https://www.tiktok.com" target="_blank" class="btn btn-outline-light btn-sm fw-bold">Watch on TikTok <i class="bi bi-box-arrow-up-right ms-1"></i></a>
  </div>

</body>
</html>
