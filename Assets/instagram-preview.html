<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Instagram Feed - Royal Glam Boutique</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    body { background-color: #fafafa; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; color: #262626; padding: 20px; }
    .insta-header { display: flex; align-items: center; gap: 20px; margin-bottom: 25px; border-bottom: 1px solid #dbdbdb; padding-bottom: 20px; }
    .profile-pic { width: 80px; height: 80px; border-radius: 50%; object-fit: cover; border: 2px solid #e1306c; padding: 2px; }
    .stat-box span { font-weight: bold; }
    .grid-container { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .grid-item { position: relative; aspect-ratio: 1; overflow: hidden; border-radius: 4px; }
    .grid-item img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.3s ease; }
    .grid-item:hover img { transform: scale(1.05); }
    .overlay { position: absolute; top:0; left:0; right:0; bottom:0; background: rgba(0,0,0,0.4); color: white; display: flex; align-items: center; justify-content: center; gap: 15px; opacity: 0; transition: opacity 0.3s ease; font-weight: bold; }
    .grid-item:hover .overlay { opacity: 1; }
  </style>
</head>
<body>

  <!-- Instagram Profile Header -->
  <div class="insta-header">
    <img src="https://images.unsplash.com/photo-1490481651871-ab68de25d43d?auto=format&fit=crop&w=300&q=80" alt="Royal Glam Avatar" class="profile-pic">
    <div>
      <div class="d-flex align-items-center gap-3 mb-2">
        <h5 class="mb-0 fw-bold">@royalglamboutique</h5>
        <a href="https://www.instagram.com" target="_blank" class="btn btn-primary btn-sm px-3 fw-bold">Follow</a>
      </div>
      <div class="d-flex gap-4 small mb-2 text-muted">
        <div><span class="text-dark">342</span> posts</div>
        <div><span class="text-dark">128.5k</span> followers</div>
        <div><span class="text-dark">140</span> following</div>
      </div>
      <p class="small mb-0"><strong>Royal Glam Boutique</strong><br>Luxury Handbags, Fine Jewellery & High Couture 💎✨<br>📍 Sandton City, Johannesburg</p>
    </div>
  </div>

  <!-- Photo Grid -->
  <div class="grid-container">
    <div class="grid-item">
      <img src="https://i.pinimg.com/1200x/1e/11/ca/1e11ca8b4ac05e984d313acb55f211df.jpg" alt="Post 1">
      <div class="overlay"><i class="bi bi-heart-fill"></i> 2.4k <i class="bi bi-chat-fill"></i> 148</div>
    </div>
    <div class="grid-item">
      <img src="https://i.pinimg.com/1200x/db/08/b1/db08b1f9376056eb531bb32750b6112f.jpg" alt="Post 2">
      <div class="overlay"><i class="bi bi-heart-fill"></i> 1.8k <i class="bi bi-chat-fill"></i> 92</div>
    </div>
    <div class="grid-item">
      <img src="https://i.pinimg.com/1200x/0d/0f/8f/0d0f8f5b1569b119df5c37edfeb4127d.jpg" alt="Post 3">
      <div class="overlay"><i class="bi bi-heart-fill"></i> 4.1k <i class="bi bi-chat-fill"></i> 310</div>
    </div>
    <div class="grid-item">
      <img src="https://i.pinimg.com/1200x/24/f1/e1/24f1e1e6116ac80b1c5c926e5fb809e6.jpg" alt="Post 4">
      <div class="overlay"><i class="bi bi-heart-fill"></i> 3.5k <i class="bi bi-chat-fill"></i> 204</div>
    </div>
    <div class="grid-item">
      <img src="https://i.pinimg.com/1200x/31/38/c0/3138c0a10c45f72007bfb911a066df26.jpg" alt="Post 5">
      <div class="overlay"><i class="bi bi-heart-fill"></i> 1.2k <i class="bi bi-chat-fill"></i> 64</div>
    </div>
    <div class="grid-item">
      <img src="https://i.pinimg.com/1200x/cd/63/9f/cd639f23cb9726b8819e6908a401ab20.jpg" alt="Post 6">
      <div class="overlay"><i class="bi bi-heart-fill"></i> 5.6k <i class="bi bi-chat-fill"></i> 412</div>
    </div>
  </div>

  <div class="text-center mt-4">
    <a href="https://www.instagram.com" target="_blank" class="btn btn-outline-dark btn-sm fw-bold">View full profile on Instagram <i class="bi bi-box-arrow-up-right ms-1"></i></a>
  </div>

</body>
</html>
