<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Facebook Page - Royal Glam Boutique</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    body { background-color: #f0f2f5; font-family: Helvetica, Arial, sans-serif; padding: 15px; }
    .fb-card { background: #fff; border-radius: 8px; box-shadow: 0 1px 2px rgba(0, 0, 0, 0.1); margin-bottom: 20px; overflow: hidden; }
    .cover-photo { width: 100%; height: 160px; object-fit: cover; }
    .page-header { position: relative; padding: 0 20px 15px 20px; margin-top: -40px; }
    .page-avatar { width: 90px; height: 90px; border-radius: 50%; border: 4px solid #fff; object-fit: cover; }
    .post-header { display: flex; align-items: center; gap: 10px; padding: 12px 16px; }
    .post-avatar { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; }
    .post-body { padding: 0 16px 12px 16px; font-size: 0.95rem; }
    .post-img { width: 100%; max-height: 350px; object-fit: cover; }
    .post-actions { display: flex; justify-content: space-around; border-top: 1px solid #e4e6eb; padding: 8px 0; color: #65676b; font-weight: 600; font-size: 0.9rem; }
    .post-actions span { cursor: pointer; display: flex; align-items: center; gap: 6px; }
    .post-actions span:hover { color: #1877f2; }
  </style>
</head>
<body>

  <!-- Facebook Page Cover & Info -->
  <div class="fb-card">
    <img src="https://images.unsplash.com/photo-1490481651871-ab68de25d43d?auto=format&fit=crop&w=1000&q=80" class="cover-photo" alt="Cover">
    <div class="page-header d-flex align-items-end justify-content-between">
      <div class="d-flex align-items-end gap-3">
        <img src="https://i.pinimg.com/736x/35/49/7e/35497e56432a16c2c3f2950a8dfe2e5b.jpg" class="page-avatar" alt="Logo">
        <div>
          <h5 class="fw-bold mb-0">Royal Glam Boutique <i class="bi bi-patch-check-fill text-primary"></i></h5>
          <span class="text-muted small">95,400 Likes • Shopping & Retail</span>
        </div>
      </div>
      <a href="https://www.facebook.com" target="_blank" class="btn btn-primary btn-sm fw-bold"><i class="bi bi-hand-thumbs-up-fill me-1"></i> Like Page</a>
    </div>
  </div>

  <!-- Feed Post 1 -->
  <div class="fb-card">
    <div class="post-header">
      <img src="https://i.pinimg.com/736x/35/49/7e/35497e56432a16c2c3f2950a8dfe2e5b.jpg" class="post-avatar" alt="Avatar">
      <div>
        <h6 class="mb-0 fw-bold">Royal Glam Boutique</h6>
        <span class="text-muted extra-small" style="font-size: 0.8rem;">2 hrs ago • <i class="bi bi-globe"></i></span>
      </div>
    </div>
    <div class="post-body">
      ✨ Step into luxury with our new Autumn Couture Collection! Designed with timeless craftsmanship for the modern icon. Visit our Sandton boutique or order online today! 💼👑
    </div>
    <img src="https://i.pinimg.com/1200x/2b/b7/93/2bb7939318e30c61c4ad3db1a86619df.jpg" class="post-img" alt="Post Media">
    <div class="post-actions">
      <span><i class="bi bi-hand-thumbs-up"></i> Like</span>
      <span><i class="bi bi-chat"></i> Comment</span>
      <span><i class="bi bi-share"></i> Share</span>
    </div>
  </div>

</body>
</html>
